[workspace]
members  = ["crates/*", "tools/xtask"]
default-members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# Internal crates
wsr = { path = "crates/wsr", version = "0.0.3" }
wsr-bench    = { path = "crates/wsr-bench", version = "0.0.3" }
wsr-cache    = { path = "crates/wsr-cache", version = "0.0.3" }
wsr-cli      = { path = "crates/wsr-cli", version = "0.0.3" }
wsr-client   = { path = "crates/wsr-client", version = "0.0.3" }
wsr-engine   = { path = "crates/wsr-engine", version = "0.0.3" }
wsr-expr     = { path = "crates/wsr-expr", version = "0.0.3" }
wsr-fs       = { path = "crates/wsr-fs", version = "0.0.3" }
wsr-gha      = { path = "crates/wsr-gha", version = "0.0.3" }
wsr-git      = { path = "crates/wsr-git", version = "0.0.3" }
wsr-resolver = { path = "crates/wsr-resolver", version = "0.0.3" }
wsr-sandbox  = { path = "crates/wsr-sandbox", version = "0.0.3" }
wsr-shell    = { path = "crates/wsr-shell", version = "0.0.3" }
wsr-tracing  = { path = "crates/wsr-tracing", version = "0.0.3" }
wsr-types    = { path = "crates/wsr-types", version = "0.0.3" }
wsr-wasix    = { path = "crates/wsr-wasix", version = "0.0.3" }

# External crates
anyhow             = "1"
cargo_metadata     = "0.23.1"
clap               = { version = "4.6.7", features = ["derive"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
thiserror          = "2"
tempfile           = "3"
toml_edit          = "0.25.16"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version      = "0.0.3"
edition      = "2024"
rust-version = "1.85"
authors      = ["Carlos Eduardo Ferreyra <eduferreyraok@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/ectorial/wsr"
homepage     = "https://github.com/ectorial/wsr"
description  = "A pre-alpha local CI runner scaffold"
readme       = "README.md"
keywords     = ["ci", "wasm", "git-hooks", "github-actions", "sandbox"]
categories   = ["development-tools", "command-line-utilities"]

[workspace.metadata.xtask]
crate-prefix  = "wsr"
primary-crate = "wsr"

[workspace.lints.rust]
unsafe_code     = "warn"
unreachable_pub = "warn"
missing_docs    = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
too_many_lines          = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto      = "thin"
