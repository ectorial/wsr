# generated by cargo xtask; rerun `cargo xtask scaffold ci --preset full` to update
name: Audit

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths: ["**/Cargo.toml", "**/Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: @checkout@
      - uses: @audit@
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
