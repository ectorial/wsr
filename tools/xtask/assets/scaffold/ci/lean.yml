# generated by cargo xtask; rerun `cargo xtask scaffold ci` to update
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: @checkout@
      - run: rustup self update
      - uses: @setup-rust@
        with:
          inherit-toolchain: true
      - run: cargo xtask ci
