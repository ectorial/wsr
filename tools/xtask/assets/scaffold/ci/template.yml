# Generated from the bundled tooling registry; run scripts/update-tooling.py.
name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  TEMPLATE_MSRV: "1.85.0"

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: @checkout@
      - run: rustup self update
      - uses: @setup-rust@
        with:
          inherit-toolchain: true
      - run: rustup toolchain install "$TEMPLATE_MSRV" --profile minimal
      - uses: @install@
        with:
          tool: cargo-generate@@cargo-generate@
      - run: python3 scripts/update-tooling.py --check
      - run: bash scripts/test-template.sh
